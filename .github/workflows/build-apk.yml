name: Genera APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Scarica il codice dal repository
      uses: actions/checkout@v3

    - name: ☕ Configura Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📱 Configura l'ambiente Android SDK
      uses: android-actions/setup-android@v2

    - name: 📦 Crea una struttura WebView nativa
      run: |
        mkdir -p android-app/app/src/main/assets/www
        cp index.html android-app/app/src/main/assets/www/index.html

    # Qui puoi aggiungere un semplice script Gradle per generare l'APK nativo
    - name: 🛠️ Info completamento struttura
      run: echo "Preparazione WebView completata con successo"
