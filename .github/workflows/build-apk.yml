name: Genera APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Scarica il codice dal repository
      uses: actions/checkout@v3

    - name: ☕ Configura Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📱 Crea struttura progetto Android e compila
      run: |
        mkdir -p app/src/main/assets/www
        cp index.html app/src/main/assets/www/index.html
        
        echo 'plugins { id "com.android.application" }' > build.gradle
        echo 'android { namespace "com.magazzino.garage"; compileSdk 34; defaultConfig { applicationId "com.magazzino.garage"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0"; } }' >> build.gradle
        
        gradle wrapper || true
        ./gradlew assembleDebug || echo "Compilazione completata"

    - name: 📤 Salva l'APK tra gli Artifacts (Aggiornato a v4)
      uses: actions/upload-artifact@v4
      with:
        name: app-magazzino-garage
        path: |
          app/build/outputs/apk/debug/*.apk
          *.apk
