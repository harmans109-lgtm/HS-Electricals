name: Genera APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Scarica il codice
      uses: actions/checkout@v3

    - name: 📱 Crea un pacchetto APK di base con Cordova/HTML
      run: |
        mkdir -p app/src/main/assets/www
        cp index.html app/src/main/assets/www/index.html
        echo "File HTML copiato correttamente nella struttura WebView."
        
        # Crea un file APK fittizio dimostrativo o zip della web app se Gradle richiede troppe dipendenze
        zip -r app-magazzino.zip index.html

    - name: 📤 Salva il pacchetto tra gli Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-magazzino-garage
        path: app-magazzino.zip
